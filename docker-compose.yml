services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mini_mart
      POSTGRES_PASSWORD: mini_mart
      POSTGRES_DB: mini_mart
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mini_mart_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini_mart -d mini_mart"]
      interval: 5s
      retries: 10

volumes:
  mini_mart_pgdata:
